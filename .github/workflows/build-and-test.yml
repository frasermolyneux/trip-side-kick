name: Build and Test
on:
  push:
    branches: [main, "feature/**", "bugfix/**", "hotfix/**", "agents/**"]
  workflow_dispatch:
permissions: {}
jobs:
  image-input-range:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Record complete triggering push range
        env:
          BEFORE_SHA: ${{ github.event.before }}
          SOURCE_SHA: ${{ github.sha }}
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          directory = Path("artifacts/publication-inputs")
          directory.mkdir(parents=True)
          (directory / "push-range.json").write_text(json.dumps({
              "before": os.environ["BEFORE_SHA"], "after": os.environ["SOURCE_SHA"]
          }), encoding="utf-8")
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: image-input-range
          path: artifacts/publication-inputs/push-range.json
          if-no-files-found: error
          retention-days: 1
  build-and-test:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: src/MX.TripSideKick.Web/ClientApp/package-lock.json
      - run: npm ci && npm run test
        working-directory: src/MX.TripSideKick.Web/ClientApp
      - uses: frasermolyneux/actions/dotnet-web-ci@dotnet-web-ci/v2.1
        with:
          test-reporting: "true"
          perform-checkout: "false"
          dotnet-project: MX.TripSideKick.Web
          dotnet-version: 10.0.x
          src-folder: src
          skip-nuget-artifact-upload: "true"
  postgres-and-containers:
    permissions:
      contents: read
    uses: ./.github/workflows/postgres-containers.yml
