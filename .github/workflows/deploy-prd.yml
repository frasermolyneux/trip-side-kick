name: Deploy Prd

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: "0 5 * * 4"

permissions: {}

concurrency:
  group: ${{ github.workflow }}

jobs:
  detect-changes:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    outputs:
      src: ${{ steps.changes.outputs.src }}
      terraform: ${{ steps.changes.outputs.terraform }}
    steps:
      - id: changes
        uses: frasermolyneux/actions/detect-changes@detect-changes/v1.0
        with:
          filters: |
            src:src/**
            terraform:terraform/**

  terraform-state-check-dev:
    if: github.event_name != 'schedule'
    permissions:
      contents: read
      id-token: write
    environment: Development
    runs-on: ubuntu-latest
    env:
      TF_VAR_cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_KEY }}
    outputs:
      has_resources: ${{ steps.state-check.outputs.has_resources }}
      state_tainted: ${{ steps.state-check.outputs.state_tainted }}
    steps:
      - id: state-check
        uses: frasermolyneux/actions/terraform-state-check@terraform-state-check/v1.1
        with:
          terraform-folder: "terraform"
          terraform-var-file: "tfvars/dev.tfvars"
          terraform-backend-file: "backends/dev.backend.hcl"
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}

  build-and-test:
    needs:
      - detect-changes
      - terraform-state-check-dev
    if: |
      !failure() && !cancelled() && (needs.detect-changes.outputs.src == 'true' || needs.terraform-state-check-dev.outputs.state_tainted == 'true')
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    outputs:
      build_version: ${{ steps.web-ci.outputs.build_version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: src/MX.TripSideKick.Web/ClientApp/package-lock.json

      - name: Install client dependencies
        working-directory: src/MX.TripSideKick.Web/ClientApp
        run: npm ci

      - name: Run client tests
        working-directory: src/MX.TripSideKick.Web/ClientApp
        run: npm run test

      - id: web-ci
        uses: frasermolyneux/actions/dotnet-web-ci@dotnet-web-ci/v2
        with:
          perform-checkout: "false"
          dotnet-project: "MX.TripSideKick.Web"
          dotnet-version: 10.0.x
          src-folder: "src"
          skip-nuget-artifact-upload: "true"

  terraform-plan-and-apply-dev:
    if: github.event_name != 'schedule'
    permissions:
      contents: read
      id-token: write
    environment: Development
    needs:
      - detect-changes
      - terraform-state-check-dev
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.repository }}-dev
    env:
      TF_VAR_cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_KEY }}
    steps:
      - if: needs.detect-changes.outputs.terraform == 'true' || needs.terraform-state-check-dev.outputs.state_tainted == 'true'
        uses: frasermolyneux/actions/terraform-plan-and-apply@terraform-plan-and-apply/v1.4
        with:
          terraform-folder: "terraform"
          terraform-var-file: "tfvars/dev.tfvars"
          terraform-backend-file: "backends/dev.backend.hcl"
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - if: needs.detect-changes.outputs.terraform != 'true' && needs.terraform-state-check-dev.outputs.state_tainted != 'true'
        uses: frasermolyneux/actions/terraform-output@terraform-output/v1.0
        with:
          terraform-folder: "terraform"
          terraform-var-file: "tfvars/dev.tfvars"
          terraform-backend-file: "backends/dev.backend.hcl"
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - id: terraform-output-dev
        shell: bash
        run: |
          cd terraform
          echo "web_app_resource_group_name=$(terraform output -raw web_app_resource_group_name)" >> $GITHUB_OUTPUT
          echo "web_app_name=$(terraform output -raw web_app_name)" >> $GITHUB_OUTPUT
          echo "sql_server_fqdn=$(terraform output -raw sql_server_fully_qualified_domain_name)" >> $GITHUB_OUTPUT
          echo "sql_database_name=$(terraform output -raw sql_database_name)" >> $GITHUB_OUTPUT
        env:
          ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          ARM_USE_AZUREAD: true
          ARM_USE_OIDC: true

      # See terraform/scripts/configure-external-id-sign-up.sh for scope/rationale.
      - uses: azure/login@532459ea530d8321f2fb9bb10d1e0bcf23869a43
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Configure Entra External ID self-service sign-up
        shell: bash
        run: terraform/scripts/configure-external-id-sign-up.sh

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore local dotnet tools (dotnet-ef)
        shell: bash
        run: dotnet tool restore

      # Idempotent EF Core migration script - safe to (re-)apply every deploy; already-applied
      # migrations are skipped via the __EFMigrationsHistory guard clauses `--idempotent` generates.
      - name: Generate idempotent EF Core migrations script
        shell: bash
        run: |
          dotnet tool run dotnet-ef migrations script --idempotent \
            --project src/MX.TripSideKick.Infrastructure \
            -o "${{ runner.temp }}/migrate-dev.sql"

      # Creates the contained database user for the App Service's system-assigned managed identity
      # (db_datareader/db_datawriter only) and applies the migrations above - both as the workload
      # service principal, which is the SQL server's Entra admin (terraform/sql.tf). See
      # terraform/scripts/configure-sql-data-access.ps1 and docs/data-and-persistence.md.
      - name: Configure SQL data access (contained user + migrations)
        shell: pwsh
        run: |
          terraform/scripts/configure-sql-data-access.ps1 `
            -SqlServerFqdn "${{ steps.terraform-output-dev.outputs.sql_server_fqdn }}" `
            -SqlDatabaseName "${{ steps.terraform-output-dev.outputs.sql_database_name }}" `
            -ManagedIdentityName "${{ steps.terraform-output-dev.outputs.web_app_name }}" `
            -MigrationsScriptPath "${{ runner.temp }}/migrate-dev.sql"

    outputs:
      web_app_resource_group_name: ${{ steps.terraform-output-dev.outputs.web_app_resource_group_name }}
      web_app_name: ${{ steps.terraform-output-dev.outputs.web_app_name }}

  app-service-deploy-dev:
    if: |
      !failure() && !cancelled() && github.event_name != 'schedule' && (needs.detect-changes.outputs.src == 'true' || needs.terraform-state-check-dev.outputs.state_tainted == 'true')
    permissions:
      contents: read
      id-token: write
    environment: Development
    needs:
      - detect-changes
      - terraform-state-check-dev
      - build-and-test
      - terraform-plan-and-apply-dev
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.repository }}-dev
    steps:
      - name: Deploy v${{ needs.build-and-test.outputs.build_version }}
        uses: frasermolyneux/actions/deploy-app-service@deploy-app-service/v1.3
        with:
          web-artifact-name: "MX.TripSideKick.Web"
          web-app-name: ${{ needs.terraform-plan-and-apply-dev.outputs.web_app_name }}
          resource-group-name: ${{ needs.terraform-plan-and-apply-dev.outputs.web_app_resource_group_name }}
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - uses: frasermolyneux/actions/wait-for-version@wait-for-version/v1.0
        with:
          info-url: "https://${{ needs.terraform-plan-and-apply-dev.outputs.web_app_name }}.azurewebsites.net/info"
          expected-version: ${{ needs.build-and-test.outputs.build_version }}

  terraform-plan-and-apply-prd:
    if: |
      !failure() && !cancelled() && (needs.terraform-plan-and-apply-dev.result == 'success' || github.event_name == 'schedule')
    permissions:
      contents: read
      id-token: write
    environment: Production
    needs:
      - detect-changes
      - build-and-test
      - terraform-plan-and-apply-dev
      - app-service-deploy-dev
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.repository }}-prd
    env:
      TF_VAR_cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_KEY }}
    steps:
      - if: needs.detect-changes.outputs.terraform == 'true'
        uses: frasermolyneux/actions/terraform-plan-and-apply@terraform-plan-and-apply/v1.4
        with:
          terraform-folder: "terraform"
          terraform-var-file: "tfvars/prd.tfvars"
          terraform-backend-file: "backends/prd.backend.hcl"
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - if: needs.detect-changes.outputs.terraform != 'true'
        uses: frasermolyneux/actions/terraform-output@terraform-output/v1.0
        with:
          terraform-folder: "terraform"
          terraform-var-file: "tfvars/prd.tfvars"
          terraform-backend-file: "backends/prd.backend.hcl"
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - id: terraform-output-prd
        shell: bash
        run: |
          cd terraform
          echo "web_app_resource_group_name=$(terraform output -raw web_app_resource_group_name)" >> $GITHUB_OUTPUT
          echo "web_app_name=$(terraform output -raw web_app_name)" >> $GITHUB_OUTPUT
          echo "sql_server_fqdn=$(terraform output -raw sql_server_fully_qualified_domain_name)" >> $GITHUB_OUTPUT
          echo "sql_database_name=$(terraform output -raw sql_database_name)" >> $GITHUB_OUTPUT
        env:
          ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          ARM_USE_AZUREAD: true
          ARM_USE_OIDC: true

      # See terraform/scripts/configure-external-id-sign-up.sh for scope/rationale.
      - uses: azure/login@532459ea530d8321f2fb9bb10d1e0bcf23869a43
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Configure Entra External ID self-service sign-up
        shell: bash
        run: terraform/scripts/configure-external-id-sign-up.sh

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore local dotnet tools (dotnet-ef)
        shell: bash
        run: dotnet tool restore

      # Idempotent EF Core migration script - safe to (re-)apply every deploy; already-applied
      # migrations are skipped via the __EFMigrationsHistory guard clauses `--idempotent` generates.
      - name: Generate idempotent EF Core migrations script
        shell: bash
        run: |
          dotnet tool run dotnet-ef migrations script --idempotent \
            --project src/MX.TripSideKick.Infrastructure \
            -o "${{ runner.temp }}/migrate-prd.sql"

      # Creates the contained database user for the App Service's system-assigned managed identity
      # (db_datareader/db_datawriter only) and applies the migrations above - both as the workload
      # service principal, which is the SQL server's Entra admin (terraform/sql.tf). See
      # terraform/scripts/configure-sql-data-access.ps1 and docs/data-and-persistence.md.
      - name: Configure SQL data access (contained user + migrations)
        shell: pwsh
        run: |
          terraform/scripts/configure-sql-data-access.ps1 `
            -SqlServerFqdn "${{ steps.terraform-output-prd.outputs.sql_server_fqdn }}" `
            -SqlDatabaseName "${{ steps.terraform-output-prd.outputs.sql_database_name }}" `
            -ManagedIdentityName "${{ steps.terraform-output-prd.outputs.web_app_name }}" `
            -MigrationsScriptPath "${{ runner.temp }}/migrate-prd.sql"

    outputs:
      web_app_resource_group_name: ${{ steps.terraform-output-prd.outputs.web_app_resource_group_name }}
      web_app_name: ${{ steps.terraform-output-prd.outputs.web_app_name }}

  app-service-deploy-prd:
    if: |
      !failure() && !cancelled() && needs.terraform-plan-and-apply-prd.result == 'success' && needs.detect-changes.outputs.src == 'true'
    permissions:
      contents: read
      id-token: write
    environment: Production
    needs:
      - detect-changes
      - build-and-test
      - terraform-plan-and-apply-prd
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.repository }}-prd
    steps:
      - name: Deploy v${{ needs.build-and-test.outputs.build_version }}
        uses: frasermolyneux/actions/deploy-app-service@deploy-app-service/v1.3
        with:
          web-artifact-name: "MX.TripSideKick.Web"
          web-app-name: ${{ needs.terraform-plan-and-apply-prd.outputs.web_app_name }}
          resource-group-name: ${{ needs.terraform-plan-and-apply-prd.outputs.web_app_resource_group_name }}
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - uses: frasermolyneux/actions/wait-for-version@wait-for-version/v1.0
        with:
          info-url: "https://${{ needs.terraform-plan-and-apply-prd.outputs.web_app_name }}.azurewebsites.net/info"
          expected-version: ${{ needs.build-and-test.outputs.build_version }}
