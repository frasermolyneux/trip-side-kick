name: "Copilot Setup Steps"

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml

permissions: {}

jobs:
  # The job MUST be called `copilot-setup-steps` or it will not be picked up by Copilot.
  copilot-setup-steps:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Shared Copilot setup
        uses: frasermolyneux/actions/copilot-setup@copilot-setup/v1
        with:
          checkout-repo: 'true'
          checkout-shared-copilot: 'true'
          setup-dotnet: 'true'
          dotnet-version: |
            10.0.x

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: src/MX.TripSideKick.Web/ClientApp/package-lock.json

      - name: Install client dependencies
        working-directory: src/MX.TripSideKick.Web/ClientApp
        run: npm ci
