name: PR Verify
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
permissions: {}
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  build-and-test:
    if: github.event.pull_request.draft == false
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: src/MX.TripSideKick.Web/ClientApp/package-lock.json
      - run: npm ci && npm run test
        working-directory: src/MX.TripSideKick.Web/ClientApp
      - uses: frasermolyneux/actions/dotnet-web-ci@dotnet-web-ci/v2.1
        with:
          test-reporting: "true"
          perform-checkout: "false"
          dotnet-project: MX.TripSideKick.Web
          dotnet-version: 10.0.x
          src-folder: src
          skip-nuget-artifact-upload: "true"
  postgres-and-containers:
    if: github.event.pull_request.draft == false
    uses: ./.github/workflows/postgres-containers.yml
    secrets: inherit
    permissions:
      contents: read
