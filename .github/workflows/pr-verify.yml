name: PR Verify

# Label-based workflow control:
# - Default: Terraform plan against Development (skips drafts)
# - 'deploy-dev': Terraform plan+apply and App Service deploy to Development
# - 'run-prd-plan': Terraform plan against Production

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: src/MX.TripSideKick.Web/ClientApp/package-lock.json

      - name: Install client dependencies
        working-directory: src/MX.TripSideKick.Web/ClientApp
        run: npm ci

      - name: Run client tests
        working-directory: src/MX.TripSideKick.Web/ClientApp
        run: npm run test

      # The .NET build drives the Vite production build through the Web project's MSBuild targets.
      - id: web-ci
        uses: frasermolyneux/actions/dotnet-web-ci@dotnet-web-ci/v2
        with:
          perform-checkout: "false"
          dotnet-project: "MX.TripSideKick.Web"
          dotnet-version: 10.0.x
          src-folder: "src"
          skip-nuget-artifact-upload: "true"

      # NBGV's build_version/semver outputs carry a non-public-build marker (e.g.
      # "0.1.5-g526a71bab4"), while the app's /info endpoint reports
      # BuildVersion = InformationalVersion.Split('+')[0] (BuildInfo.cs). These never match on
      # non-public (PR) builds, so derive the expected value the same way the app does:
      #   1. Strip SemVer2 build metadata after '+' (matches Split('+')[0] exactly).
      #   2. Strip a trailing "-g<hex>" git-height marker - NBGV's non-public-build tag - while
      #      preserving any real prerelease label (e.g. "-preview") that isn't of that form.
      - id: expected-version
        shell: bash
        run: |
          SEMVER="${{ steps.web-ci.outputs.semver }}"
          BASE="${SEMVER%%+*}"
          if [[ "$BASE" =~ ^(.*)-g[0-9a-f]+$ ]]; then
            BASE="${BASH_REMATCH[1]}"
          fi
          echo "value=$BASE" >> "$GITHUB_OUTPUT"

    outputs:
      build_version: ${{ steps.web-ci.outputs.build_version }}
      expected_version: ${{ steps.expected-version.outputs.value }}

  terraform-plan-dev:
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    if: github.event.pull_request.draft == false && !contains(github.event.pull_request.labels.*.name, 'deploy-dev') && contains(fromJson('["opened","synchronize","reopened","ready_for_review"]'), github.event.action)
    needs: build-and-test
    environment: Development
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.repository }}-dev
    env:
      TF_VAR_cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_KEY }}
    steps:
      - uses: frasermolyneux/actions/terraform-plan@terraform-plan/v1.4
        with:
          terraform-folder: "terraform"
          terraform-var-file: "tfvars/dev.tfvars"
          terraform-backend-file: "backends/dev.backend.hcl"
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}

  terraform-plan-and-apply-dev:
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    if: github.event.pull_request.draft == false && github.event.pull_request.user.login != 'dependabot[bot]' && contains(github.event.pull_request.labels.*.name, 'deploy-dev') && (contains(fromJson('["opened","synchronize","reopened","ready_for_review"]'), github.event.action) || (github.event.action == 'labeled' && github.event.label.name == 'deploy-dev'))
    needs: build-and-test
    environment: Development
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.repository }}-dev
    env:
      TF_VAR_cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_KEY }}
    steps:
      - uses: frasermolyneux/actions/terraform-plan-and-apply@terraform-plan-and-apply/v1.4
        with:
          terraform-folder: "terraform"
          terraform-var-file: "tfvars/dev.tfvars"
          terraform-backend-file: "backends/dev.backend.hcl"
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - id: terraform-output
        shell: bash
        run: |
          cd terraform
          echo "web_app_resource_group_name=$(terraform output -raw web_app_resource_group_name)" >> $GITHUB_OUTPUT
          echo "web_app_name=$(terraform output -raw web_app_name)" >> $GITHUB_OUTPUT
        env:
          ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          ARM_USE_AZUREAD: true
          ARM_USE_OIDC: true

    outputs:
      web_app_resource_group_name: ${{ steps.terraform-output.outputs.web_app_resource_group_name }}
      web_app_name: ${{ steps.terraform-output.outputs.web_app_name }}

  app-service-deploy-dev:
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    if: github.event.pull_request.draft == false && github.event.pull_request.user.login != 'dependabot[bot]' && contains(github.event.pull_request.labels.*.name, 'deploy-dev') && (contains(fromJson('["opened","synchronize","reopened","ready_for_review"]'), github.event.action) || (github.event.action == 'labeled' && github.event.label.name == 'deploy-dev'))
    environment: Development
    needs: [build-and-test, terraform-plan-and-apply-dev]
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.repository }}-dev
    steps:
      - uses: frasermolyneux/actions/deploy-app-service@deploy-app-service/v1.3
        with:
          web-artifact-name: "MX.TripSideKick.Web"
          web-app-name: ${{ needs.terraform-plan-and-apply-dev.outputs.web_app_name }}
          resource-group-name: ${{ needs.terraform-plan-and-apply-dev.outputs.web_app_resource_group_name }}
          info-url: "https://${{ needs.terraform-plan-and-apply-dev.outputs.web_app_name }}.azurewebsites.net/info"
          expected-version: ${{ needs.build-and-test.outputs.expected_version }}
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - uses: frasermolyneux/actions/wait-for-version@wait-for-version/v1.0
        with:
          info-url: "https://${{ needs.terraform-plan-and-apply-dev.outputs.web_app_name }}.azurewebsites.net/info"
          expected-version: ${{ needs.build-and-test.outputs.expected_version }}

  terraform-plan-prd:
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    if: github.event.pull_request.draft == false && contains(github.event.pull_request.labels.*.name, 'run-prd-plan') && (contains(fromJson('["opened","synchronize","reopened","ready_for_review"]'), github.event.action) || (github.event.action == 'labeled' && github.event.label.name == 'run-prd-plan'))
    needs: build-and-test
    environment: Production
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.repository }}-prd
    env:
      TF_VAR_cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_KEY }}
    steps:
      - uses: frasermolyneux/actions/terraform-plan@terraform-plan/v1.4
        with:
          terraform-folder: "terraform"
          terraform-var-file: "tfvars/prd.tfvars"
          terraform-backend-file: "backends/prd.backend.hcl"
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
