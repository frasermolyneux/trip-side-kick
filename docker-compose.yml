# Local disposable database only; production is generated from workload.json.
services:
  postgres:
    image: postgres:18-bookworm
    environment:
      POSTGRES_USER: tripsidekick
      POSTGRES_DB: tripsidekick
      POSTGRES_PASSWORD: local-development-only
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "tripsidekick", "-d", "tripsidekick"]
      interval: 5s
      timeout: 5s
      retries: 12
volumes:
  postgres-data:
